# Fly.io deployment for the OMH Heartbeat DEMO (training data only). See docs/OPERATIONS.md.
# A real deployment needs managed PostgreSQL with backups, SMTP, a texting provider and a
# separate key store; this demo has none of those and refuses to let any organization go live.

app = "omh-heartbeat"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HEARTBEAT_DEMO = "1"
  HEARTBEAT_PUBLIC_URL = "https://heartbeat.openmissionofhope.org"
  HEARTBEAT_EXTRA_ORIGINS = "https://omh-heartbeat.fly.dev"
  HEARTBEAT_TRUST_PROXY = "1"
  HEARTBEAT_AUDIT_EXPORT_DIR = "/tmp/audit-export"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Liveness only; /healthz reports operational problems for a person to look at.
  [[http_service.checks]]
    method = "GET"
    path = "/livez"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
